name: Quality and tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  run-makefile-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Linter via Makefile
        run: make lint
        
  test-and-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 2. Instalar el CLI de Qlty en el runner
      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@fd52dc852530a708d68c3b7342f8d33d1df4cd55    # v2.2.1

      # 3. Formatear y analizar la salud del código
      - name: Check quality
        run: qlty check

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Ejecutar Pytest con Cobertura via Poetry
        run: poetry run pytest --cov=. --cov-report=xml

      - name: Enviar Reporte a Qlty Cloud
        uses: qltysh/qlty-action/coverage@fd52dc852530a708d68c3b7342f8d33d1df4cd55     # v2.2.1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml